services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mapping_app
        ports:
            - 8000:8000
        volumes:
            - .:/var/www
            - vendor_data:/var/www/vendor
            - build_data:/var/www/public/build
        depends_on:
            - mysql
        networks:
            - laravel
        command: >
            sh -c "sleep 10 &&
                   php artisan key:generate --force &&
                   php artisan migrate --force &&
                   php artisan serve --host=0.0.0.0 --port=8000"

    mysql:
        image: mysql:8.2
        container_name: mapping_mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
        ports:
            - 3306:3306
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: mapping_phpmyadmin
        restart: always
        ports:
            - 8080:80
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: root
            UPLOAD_LIMIT: 64M
            PHP_UPLOAD_MAX_FILESIZE: 64M
            PHP_POST_MAX_SIZE: 64M
        depends_on:
            - mysql
        networks:
            - laravel

volumes:
    mysql_data:
    vendor_data:
    build_data:

networks:
    laravel:
        driver: bridge
